<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапер (Minesweeper)</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --board-bg: #bdbdbd;
            --cell-bg: #e0e0e0;
            --cell-hover: #d0d0d0;
            --cell-revealed: #ffffff;
            --border-light: #ffffff;
            --border-dark: #7b7b7b;
            --primary-color: #4a90e2;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
        }

        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        select, button {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
            cursor: pointer;
            transition: all 0.2s;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
        }

        button:hover {
            background-color: #357abd;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 18px;
        }

        .board {
            display: grid;
            background-color: var(--board-bg);
            border: 4px solid var(--board-bg);
            border-radius: 4px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            user-select: none;
        }

        .cell {
            width: 30px;
            height: 30px;
            background-color: var(--cell-bg);
            border-top: 3px solid var(--border-light);
            border-left: 3px solid var(--border-light);
            border-right: 3px solid var(--border-dark);
            border-bottom: 3px solid var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            box-sizing: border-box;
        }

        .cell:hover:not(.revealed) {
            background-color: var(--cell-hover);
        }

        .cell.revealed {
            background-color: var(--cell-revealed);
            border: 1px solid #ccc;
            cursor: default;
        }

        .cell.mine {
            background-color: #e74c3c;
            border: 1px solid #c0392b;
        }

        .cell.flagged {
            color: #e74c3c;
        }

        /* Цвета цифр */
        .num-1 { color: #0000ff; }
        .num-2 { color: #008000; }
        .num-3 { color: #ff0000; }
        .num-4 { color: #000080; }
        .num-5 { color: #800000; }
        .num-6 { color: #008080; }
        .num-7 { color: #000000; }
        .num-8 { color: #808080; }

        .message {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
            height: 30px;
        }

        .win { color: #27ae60; }
        .lose { color: #c0392b; }

    </style>
</head>
<body>

    <h1>Сапер</h1>

    <div class="controls">
        <select id="difficulty">
            <option value="easy">Легкий (9x9, 10 мин)</option>
            <option value="medium" selected>Средний (16x16, 40 мин)</option>
            <option value="hard">Сложный (30x16, 99 мин)</option>
        </select>
        <button onclick="initGame()">Новая игра</button>
    </div>

    <div class="game-info">
        <span id="mines-count">💣 40</span>
        <span id="timer">⏱️ 000</span>
    </div>

    <div id="board" class="board"></div>
    <div id="message" class="message"></div>

    <script>
        const boardElement = document.getElementById('board');
        const minesCountElement = document.getElementById('mines-count');
        const timerElement = document.getElementById('timer');
        const messageElement = document.getElementById('message');
        const difficultySelect = document.getElementById('difficulty');

        let rows = 16;
        let cols = 16;
        let mines = 40;
        let grid = [];
        let gameOver = false;
        let flags = 0;
        let seconds = 0;
        let timerInterval = null;
        let firstClick = true;

        const difficulties = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 }
        };

        function initGame() {
            // Сброс состояния
            clearInterval(timerInterval);
            seconds = 0;
            timerElement.innerText = '⏱️ 000';
            messageElement.innerText = '';
            messageElement.className = 'message';
            gameOver = false;
            firstClick = true;
            grid = [];
            flags = 0;

            // Получение настроек сложности
            const diff = difficulties[difficultySelect.value];
            rows = diff.rows;
            cols = diff.cols;
            mines = diff.mines;

            updateMinesCounter();

            // Настройка сетки CSS
            boardElement.style.gridTemplateColumns = `repeat(${cols}, 30px)`;
            boardElement.style.gridTemplateRows = `repeat(${rows}, 30px)`;
            boardElement.innerHTML = '';

            // Создание ячеек
            for (let r = 0; r < rows; r++) {
                const row = [];
                for (let c = 0; c < cols; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    // Обработчики событий
                    cell.addEventListener('click', handleClick);
                    cell.addEventListener('contextmenu', handleRightClick);

                    boardElement.appendChild(cell);
                    row.push({
                        element: cell,
                        isMine: false,
                        revealed: false,
                        flagged: false,
                        neighborMines: 0
                    });
                }
                grid.push(row);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                seconds++;
                timerElement.innerText = `⏱️ ${seconds.toString().padStart(3, '0')}`;
            }, 1000);
        }

        function placeMines(excludeRow, excludeCol) {
            let minesPlaced = 0;
            while (minesPlaced < mines) {
                const r = Math.floor(Math.random() * rows);
                const c = Math.floor(Math.random() * cols);

                // Не ставим мину там, где кликнули первый раз, и где уже есть мина
                if (!grid[r][c].isMine && (r !== excludeRow || c !== excludeCol)) {
                    grid[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            // Подсчет соседей
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!grid[r][c].isMine) {
                        let count = 0;
                        getNeighbors(r, c).forEach(([nr, nc]) => {
                            if (grid[nr][nc].isMine) count++;
                        });
                        grid[r][c].neighborMines = count;
                    }
                }
            }
        }

        function getNeighbors(r, c) {
            const neighbors = [];
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    const nr = r + i;
                    const nc = c + j;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        neighbors.push([nr, nc]);
                    }
                }
            }
            return neighbors;
        }

        function handleClick(e) {
            if (gameOver) return;
            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);
            const cellData = grid[r][c];

            if (cellData.flagged || cellData.revealed) return;

            if (firstClick) {
                firstClick = false;
                placeMines(r, c);
                startTimer();
            }

            if (cellData.isMine) {
                gameOverLoss();
            } else {
                revealCell(r, c);
                checkWin();
            }
        }

        function handleRightClick(e) {
            e.preventDefault();
            if (gameOver) return;

            const r = parseInt(e.target.dataset.row);
            const c = parseInt(e.target.dataset.col);
            const cellData = grid[r][c];

            if (cellData.revealed) return;

            if (!cellData.flagged) {
                cellData.flagged = true;
                cellData.element.classList.add('flagged');
                cellData.element.innerText = '🚩';
                flags++;
            } else {
                cellData.flagged = false;
                cellData.element.classList.remove('flagged');
                cellData.element.innerText = '';
                flags--;
            }
            updateMinesCounter();
        }

        function revealCell(r, c) {
            const cellData = grid[r][c];
            if (cellData.revealed || cellData.flagged) return;

            cellData.revealed = true;
            cellData.element.classList.add('revealed');

            if (cellData.neighborMines > 0) {
                cellData.element.innerText = cellData.neighborMines;
                cellData.element.classList.add(`num-${cellData.neighborMines}`);
            } else {
                // Если 0 мин вокруг, открываем соседей (рекурсия)
                const neighbors = getNeighbors(r, c);
                neighbors.forEach(([nr, nc]) => {
                    if (!grid[nr][nc].revealed) {
                        revealCell(nr, nc);
                    }
                });
            }
        }

        function updateMinesCounter() {
            minesCountElement.innerText = `💣 ${mines - flags}`;
        }

        function gameOverLoss() {
            gameOver = true;
            clearInterval(timerInterval);
            messageElement.innerText = '💥 Вы проиграли!';
            messageElement.classList.add('lose');

            // Показать все мины
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c].isMine) {
                        grid[r][c].element.classList.add('mine');
                        grid[r][c].element.innerText = '💣';
                    }
                }
            }
        }

        function checkWin() {
            let revealedCount = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c].revealed) revealedCount++;
                }
            }

            if (revealedCount === (rows * cols) - mines) {
                gameOver = true;
                clearInterval(timerInterval);
                messageElement.innerText = '🎉 Победа!';
                messageElement.classList.add('win');

                // Автоматически ставим флаги на оставшиеся мины
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (grid[r][c].isMine && !grid[r][c].flagged) {
                            grid[r][c].element.innerText = '🚩';
                            grid[r][c].element.classList.add('flagged');
                        }
                    }
                }
                minesCountElement.innerText = '💣 0';
            }
        }

        // Запуск игры при загрузке
        initGame();

    </script>
</body>
</html>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапер (Minesweeper)</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --board-bg: #2c3e50;
            --cell-bg: #ecf0f1;
            --cell-hover: #bdc3c7;
            --cell-revealed: #ffffff;
            --border-light: #ffffff;
            --border-dark: #95a5a6;
            --primary-color: #3498db;
            --primary-hover: #2980b9;
            --text-color: #2c3e50;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --cell-shadow: inset 2px 2px 5px rgba(255, 255, 255, 0.7),
                           inset -2px -2px 5px rgba(0, 0, 0, 0.1);
            --cell-revealed-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text-color);
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 25px;
            color: #ffffff;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
            animation: fadeInDown 0.8s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        select, button {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        select {
            background-color: #ffffff;
            color: var(--text-color);
            outline: none;
        }

        select:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 500px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            animation: fadeIn 1.2s ease-out;
        }

        .game-info span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .board {
            display: grid;
            background-color: var(--board-bg);
            padding: 10px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            user-select: none;
            animation: zoomIn 0.5s ease-out;
        }

        @keyframes zoomIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .cell {
            width: 35px;
            height: 35px;
            background: var(--cell-bg);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
            box-sizing: border-box;
            border-radius: 4px;
            box-shadow: var(--cell-shadow);
            transition: all 0.15s ease;
            margin: 1px;
        }

        .cell:hover:not(.revealed) {
            background: var(--cell-hover);
            transform: scale(1.05);
            box-shadow: inset 2px 2px 5px rgba(255, 255, 255, 0.9),
                        inset -2px -2px 5px rgba(0, 0, 0, 0.15);
        }

        .cell:active:not(.revealed) {
            transform: scale(0.95);
        }

        .cell.revealed {
            background-color: var(--cell-revealed);
            box-shadow: var(--cell-revealed-shadow);
            cursor: default;
            animation: reveal 0.2s ease-out;
        }

        @keyframes reveal {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .cell.mine {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .cell.flagged {
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Цвета цифр */
        .num-1 { color: #3498db; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .num-2 { color: #27ae60; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .num-3 { color: #e74c3c; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .num-4 { color: #9b59b6; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .num-5 { color: #e67e22; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .num-6 { color: #1abc9c; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .num-7 { color: #34495e; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        .num-8 { color: #7f8c8d; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }

        .message {
            margin-top: 20px;
            font-size: 24px;
            font-weight: bold;
            height: 40px;
            padding: 10px 30px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: var(--shadow);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .win {
            color: #27ae60;
            background: linear-gradient(135deg, #d5f5e3 0%, #abebc6 100%) !important;
        }

        .lose {
            color: #c0392b;
            background: linear-gradient(135deg, #fadbd8 0%, #f5b7b1 100%) !important;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .cell {
                width: 28px;
                height: 28px;
                font-size: 16px;
            }

            .controls {
                flex-direction: column;
            }

            select, button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
